name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Lightweight subset: the test suite only needs numpy/pandas via
      # aloy/__init__ (aloy.experiment_log is stdlib-only). Heavy deps
      # (pycalphad, botorch, torch) are not needed for tests.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pytest
      - name: Run test suite
        run: PYTHONPATH=src python -m pytest tests/ -v
